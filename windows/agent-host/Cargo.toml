[package]
name = "marea-agent"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Native Windows isolation host for Marea's AI worker"
autobins = false

[features]
test-fixtures = []

[[bin]]
name = "marea-agent"
path = "src/main.rs"

[[bin]]
name = "marea-agent-child-probe"
path = "fixtures/child-probe.rs"
required-features = ["test-fixtures"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Isolation",
    "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_Console", "Win32_System_Threading", "Win32_System_JobObjects",
    "Win32_System_SystemInformation", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi",
    "Win32_System_SystemServices"
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
